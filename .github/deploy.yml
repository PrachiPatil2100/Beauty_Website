name: Deploy EmbraceYourself Website to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/embrace-beauty-site:latest

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands via EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Pull the latest website image from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/embrace-beauty-site:latest
            
            # 2. Stop and remove the existing container if it's running
            docker stop beauty-website-container || true
            docker rm beauty-website-container || true
            
            # 3. Run the new container, mapping EC2's port 8080 to Nginx's port 8080
            docker run -d \
              --name beauty-website-container \
              -p 8080:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/embrace-beauty-site:latest
            
            # 4. Clean up old, unused Docker images to keep the EC2 server clean
            docker image prune -a -f